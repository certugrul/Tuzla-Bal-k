[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200
  force = true

[[redirects]]
  from = "/api/menu"
  to = "/.netlify/functions/menu"
  status = 200
  force = true

[[redirects]]
  from = "/api/reservations"
  to = "/.netlify/functions/reservations"
  status = 200
  force = true

[[redirects]]
  from = "/api/reservations/*"
  to = "/.netlify/functions/reservations"
  status = 200
  force = true

[[redirects]]
  from = "/api/surveys"
  to = "/.netlify/functions/surveys"
  status = 200
  force = true

[[redirects]]
  from = "/api/surveys/*"
  to = "/.netlify/functions/surveys"
  status = 200
  force = true
